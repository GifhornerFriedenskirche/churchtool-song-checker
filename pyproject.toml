[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-ai-service"
version = "0.1.0"
description = "Secure, sustainable, and well-documented Python service."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
  { name = "Martin [Org]", email = "dev@yourdomain.tld" }
]

[tool.black]
line-length = 100
target-version = ['py313']
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
combine_as_imports = true
force_grid_wrap = 0

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = ["venv", ".venv", "build", "dist"]

[tool.mypy]
python_version = 3.13
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=. --cov-report=term-missing --cov-report=xml --maxfail=1 --durations=10"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.bandit]
skips = ["B101"]  # Example: skip assert usage check

[tool.semantic_release]
version_source = "commit"
branch = "main"
upload_to_pypi = false
changelog_file = "CHANGELOG.md"
build_command = "pytest && python setup.py sdist bdist_wheel"

[tool.dependabot]
package-ecosystem = "pip"
directory = "/"
schedule = { interval = "weekly" }

[tool.pip-audit]
require_hashes = true

[tool.ruff]
select = ["E", "F", "I"]
line-length = 100
target-version = "py312"

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
flake8 = "^7.0"
mypy = "^1.10"
black = "^24.0"
isort = "^5.12"
bandit = "^1.7"
pip-audit = "^2.6"
semantic-release = "^9.0"
