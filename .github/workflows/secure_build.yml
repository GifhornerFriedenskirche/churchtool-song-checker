name: 🔐 Secure, Tested & Green Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.13'
      PIP_CACHE_DIR: ~/.cache/pip
      VIRTUAL_ENV: .venv

    steps:
      - name: 🧹 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m venv $VIRTUAL_ENV
          source $VIRTUAL_ENV/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy bandit pip-audit black isort

      - name: 🧪 Run Unit Tests with Coverage
        run: |
          source $VIRTUAL_ENV/bin/activate
          pytest --cov=. --cov-report=xml --cov-report=term-missing -v
        continue-on-error: false

      - name: 🧰 Static Code Analysis (Lint, Type, Style)
        run: |
          source $VIRTUAL_ENV/bin/activate
          flake8 .
          mypy .
          black --check .
          isort --check-only .
        continue-on-error: false

      - name: 🔒 Security Scan (Bandit + Pip Audit)
        run: |
          source $VIRTUAL_ENV/bin/activate
          bandit -r . -lll
          pip-audit
        continue-on-error: false

      - name: 🧬 Dependency Review (only on PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: 🌱 Green CI Optimization
        run: |
          echo "Reusing pip cache to minimize network & build emissions."
          echo "Parallel test execution enabled via pytest-xdist."
        continue-on-error: true

      - name: 📊 Upload Coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: 🧩 Observability Check (Logging & Metrics)
        run: |
          grep -r "logging\." . || echo "⚠️ No logging calls detected."
          grep -r "metrics" . || echo "⚠️ No metrics collection found."
        continue-on-error: true

      - name: ✅ Summary
        run: echo "✅ All checks completed successfully!"
